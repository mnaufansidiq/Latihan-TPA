<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TPA AI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--ink:#1d2430;--mut:#667085;--line:#e3e1da;--pri:#2f5bea;--priink:#fff;--ok:#1a8a52;--okbg:#e5f5ec;--bad:#c23b3b;--badbg:#fbe9e9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--ink:#eceff4;--mut:#9aa3b2;--line:#2c323c;--pri:#6f8cff;--priink:#101420;--ok:#4cc88a;--okbg:#17302400;--bad:#ff7b7b;--badbg:#3a1d1d}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--ink:#eceff4;--mut:#9aa3b2;--line:#2c323c;--pri:#6f8cff;--priink:#101420;--ok:#4cc88a;--okbg:#173024;--bad:#ff7b7b;--badbg:#3a1d1d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.t{display:block;font-weight:600;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.btn{background:var(--pri);color:var(--priink);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;font:inherit}
.opt b{min-width:1.4em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.exp{border-left:3px solid var(--pri);padding:6px 12px;margin:12px 0;color:var(--ink);white-space:pre-wrap}
.score{font-size:3rem;font-weight:700;margin:0}
.err{color:var(--bad);margin:10px 0 0}
.mut{color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.ans{display:flex;gap:8px;margin-top:8px}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
#nav{max-width:680px;margin:0 auto;padding:12px 16px 0;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.75rem;color:var(--mut)}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.9rem}
.brow .bl{width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{flex:1;margin:0}.brow .bp{width:90px;text-align:right;color:var(--mut);font-size:.8rem}
.trend{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:18px;margin-top:8px}
.trend div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:4px;position:relative}
.trend div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--mut)}
.heat{display:flex;gap:4px;margin-top:8px}.heat i{display:block;flex:1;max-width:26px;height:26px;border-radius:5px;background:var(--line)}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav id="nav" style="display:none"></nav>
<main id="app"></main>
<script>
(function(){
var app=document.getElementById('app');
var CATS={Verbal:'Verbal (sinonim, antonim, analogi)',Numerik:'Numerik (deret, persen, perbandingan, soal cerita)',Logika:'Logika (silogisme, jika-maka, penalaran analitis)',Figural:'Figural (deret gambar dan pola)',Spasial:'Spasial (rotasi dan cermin bentuk)',SJT:'Situasi kerja (SJT)',Proyektif:'Tes proyektif (kalimat tak lengkap)',Kepribadian:'Tes kepribadian (Big Five)',Campuran:'Campuran semua bagian'};
var cfg={cat:'Campuran',level:'Sedang',n:10};
var S={qs:[],i:0,ans:[],picked:null,left:0,timer:null,sample:null,aiOn:false};
var BANK=[
{q:'Sinonim: KOMPREHENSIF',options:['Sempit','Menyeluruh','Rinci','Dangkal','Singkat'],answer:1,explanation:'Komprehensif berarti menyeluruh.'},
{q:'Antonim: EKSPANSI',options:['Perluasan','Pertumbuhan','Penyusutan','Pengembangan','Peningkatan'],answer:2,explanation:'Ekspansi berarti perluasan, lawannya penyusutan.'},
{q:'Dokter : Rumah Sakit = Guru : ...',options:['Murid','Sekolah','Buku','Ijazah','Kelas'],answer:1,explanation:'Hubungan profesi dan tempat kerja.'},
{q:'3, 6, 11, 18, 27, ...',options:['36','37','38','39','40'],answer:2,explanation:'Selisih 3, 5, 7, 9, berikutnya 11. 27 + 11 = 38.'},
{q:'Harga Rp250.000 diskon 30%. Harga yang dibayar?',options:['Rp165.000','Rp170.000','Rp175.000','Rp180.000','Rp185.000'],answer:2,explanation:'250.000 x 0,7 = 175.000.'},
{q:'Jika lembur, maka dapat uang makan. Rina tidak dapat uang makan. Kesimpulan?',options:['Rina lembur','Rina tidak lembur','Rina mungkin lembur','Rina tidak bekerja','Tidak dapat disimpulkan'],answer:1,explanation:'Kontraposisi: tidak uang makan berarti tidak lembur.'}
];
var BT=[['Verbal','Sinonim'],['Verbal','Antonim'],['Verbal','Analogi'],['Numerik','Deret angka'],['Numerik','Persen dan diskon'],['Logika','Jika-maka']];
BANK.forEach(function(b,i){b['bagian']=BT[i][0];b.topik=BT[i][1]});
function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function clear(){app.innerHTML=''}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}

function chips(parent,title,opts,key,conv){
 parent.appendChild(h('label','t',title));
 var row=h('div','row');
 opts.forEach(function(o){
  var b=h('button','chip',String(o));b.type='button';
  b.setAttribute('aria-pressed',String(cfg[key]==o));
  b.onclick=function(){cfg[key]=conv?conv(o):o;[].forEach.call(row.children,function(c){c.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')};
  row.appendChild(b)});
 parent.appendChild(row);
}

function setup(msg){
 stop();clear();
 setInfo=null;nav('latihan');app.appendChild(h('h1',null,'Latihan TPA dengan AI'));
 app.appendChild(h('p','sub','Soal dibuat baru oleh AI (Gemini lewat Worker Cloudflare-mu) setiap sesi, lengkap dengan pembahasan.'));
 app.appendChild(h('p','mut','Hari ini: '+todayQ()+' dari target '+DB.target+' soal.'));
 var c=h('div','card');
 chips(c,'Bagian',Object.keys(CATS),'cat');
 c.appendChild(h('p','mut',''));
 chips(c,'Tingkat',['Mudah','Sedang','Sulit'],'level');
 chips(c,'Jumlah soal',[5,10,20,30,40],'n',Number);
 var go=h('button','btn','Mulai latihan');go.onclick=start;c.appendChild(go);
 if(msg)c.appendChild(h('p','err',msg));
 app.appendChild(c);
 app.appendChild(h('p','mut','Timer otomatis: 45 detik per soal, sesuai tempo tes perusahaan.'));app.appendChild(connCard());
}

/* ==== Worker Cloudflare milik sendiri (sama dengan yang dipakai Generator Laporan SO) ==== */
var WORKER_URL=(function(){var d='https://so-proxy.mnaufansidiq.workers.dev/';try{return localStorage.getItem('tpa_worker')||d}catch(e){return d}})();
const LEVEL_NOTE={Mudah:'Mudah: konsep dasar, hitungan sederhana.',Sedang:'Sedang: butuh 2 langkah berpikir.',Sulit:'Sulit: butuh 3 langkah atau jebakan logika, tetap bisa selesai sekitar 45 detik.'};

async function callWorker(promptText,timeoutMs){
 var lastErr;
 for(var attempt=1;attempt<=2;attempt++){
  var timer,tmo=new Promise(function(_,rej){timer=setTimeout(function(){rej(new Error('Permintaan ke AI terlalu lama (timeout)'))},timeoutMs||40000)});
  try{
   var res=await Promise.race([fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptText})}),tmo]);
   clearTimeout(timer);
   var data=null;try{data=await res.json()}catch(e){}
   if(!res.ok){
    if(attempt===1&&(res.status===429||res.status>=500)){await new Promise(function(r){setTimeout(r,800)});continue}
    throw new Error((data&&data.error)||('Worker status '+res.status));
   }
   var text=((data&&data.text)||'').trim();
   if(!text)throw new Error('AI tidak memberikan hasil.');
   return text;
  }catch(err){
   clearTimeout(timer);lastErr=err;
   if(attempt===1)continue;
  }
 }
 throw lastErr;
}

function parseJsonArray(text){
 text=(text||'').replace(/```json|```/gi,'').trim();
 var i=text.indexOf('['),j=text.lastIndexOf(']');
 if(i<0||j<=i)throw new Error('format tidak valid');
 return JSON.parse(text.slice(i,j+1));
}

async function generateQuestions(c,onP){
 var per=c.n>20?8:5,sizes=[],seen={},out=[],next=0;
 for(var l=c.n;l>0;l-=per)sizes.push(Math.min(per,l));
 var total=sizes.length;
 async function run(){
  while(next<sizes.length){
   var idx=next++,cnt=sizes[idx];
   var prompt='Kamu penyusun soal TPA (Tes Potensi Akademik) untuk seleksi rekrutmen perusahaan di Indonesia.\n'+
   'Buat '+cnt+' soal pilihan ganda dalam Bahasa Indonesia.\nBagian: '+CATS[c.cat]+'.\nTingkat kesulitan: '+c.level+'. '+LEVEL_NOTE[c.level]+'\n'+
   'Ini kelompok soal ke-'+(idx+1)+' dari '+total+', jadi pilih jenis soal dan topik yang berbeda dari kelompok lain.\n'+
   'Aturan: tepat 5 opsi per soal, hanya satu jawaban benar, jawaban harus benar secara matematis atau logis (periksa ulang hitungan), posisi jawaban benar bervariasi, soal bisa dikerjakan sekitar 45 detik, hanya teks tanpa gambar.\n'+
   'Keluaran: HANYA JSON array tanpa teks lain, tanpa markdown: [{"q":"...","bagian":"Verbal atau Numerik atau Logika","topik":"nama topik singkat, misal Deret angka","options":["a","b","c","d","e"],"answer":0,"explanation":"pembahasan singkat langkah demi langkah"}] dengan answer = indeks 0 sampai 4.';
   try{
    if(c.cat==='SJT')prompt=sjtPrompt(cnt,idx,total,c.level);var arr=parseJsonArray(await callWorker(prompt,60000));
    arr.forEach(function(x){if(x&&typeof x.q==='string'&&!seen[x.q]){seen[x.q]=1;out.push(x)}});
   }catch(e){lastErr=errMsg(e)}
   if(onP)onP(out.length);
  }
 }
 await Promise.all([run(),run(),run()]);
 if(out.length>0&&out.length<c.n){sizes=[Math.min(8,c.n-out.length)];next=0;await run()}
 return out;
}

async function explainQ(q,k){
 var p='Jelaskan dengan bahasa Indonesia yang sederhana untuk pemula, langkah demi langkah, lalu beri trik cepat agar soal ini bisa dikerjakan dalam 45 detik.\nSoal: '+q.q+'\nOpsi: '+q.options.map(function(o,j){return 'ABCDE'[j]+'. '+o}).join(' | ')+'\nJawaban benar: '+'ABCDE'[q.answer]+'\nJawaban peserta: '+'ABCDE'[k]+'\nMaksimal 120 kata, tanpa format markdown.';
 return (await callWorker(p,30000)).replace(/\*\*/g,'');
}

async function start(){
 if(cfg.cat==='Kepribadian'||cfg.cat==='Proyektif')return startSet(cfg.cat);
 clear();
 nav(null);var box=h('div','card');var p=h('p',null,'');var sp=h('span','spin');p.appendChild(sp);var gt=h('span',null,'AI sedang menyusun soal... 0/'+cfg.n);p.appendChild(gt);
 box.appendChild(p);app.appendChild(box);
 var qs=null;
  if(cfg.cat==='Figural'||cfg.cat==='Spasial'){qs=[];for(var z=0;z<cfg.n;z++)qs.push(visQ(cfg.cat,cfg.level));S.vis=true}else S.vis=false;
 if(!qs)try{
  var arr=await generateQuestions(cfg,function(d){gt.textContent='AI sedang menyusun soal... '+Math.min(d,cfg.n)+'/'+cfg.n});
  if(Array.isArray(arr)){
   qs=arr.filter(function(x){return x&&typeof x.q==='string'&&Array.isArray(x.options)&&x.options.length>=2&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.options.length}).slice(0,cfg.n);
   if(!qs.length)qs=null;
  }
 }catch(e){qs=null;lastErr=errMsg(e)}
 S.aiOn=!!qs&&!S.vis;
 if(!qs){S.aiOn=false;alert('AI tidak bisa dihubungi'+(lastErr?' ('+lastErr+')':'')+'. Memakai soal cadangan.');qs=BANK.slice().sort(function(){return Math.random()-.5}).slice(0,Math.min(cfg.n,BANK.length))}
 qs.forEach(function(q){if(['Verbal','Numerik','Logika','Figural','Spasial','SJT'].indexOf(q.bagian)<0)q.bagian=(cfg.cat!=='Campuran'?cfg.cat:'Lainnya');q.topik=String(q.topik||'Umum').slice(0,40)});S.qs=qs;S.i=0;S.ans=[];S.times=[];S.saved=false;S.picked=null;S.left=qs.length*45;
 S.timer=setInterval(function(){S.left--;var t=document.getElementById('tm');if(t)t.textContent=fmt(Math.max(S.left,0));if(S.left<=0){finish()}},1000);
 quiz();
}

function quiz(){
 clear();nav(null);S.t0=Date.now();
 var q=S.qs[S.i];
 var top=h('div','top');var ex=h('button','chip','Akhiri sesi');ex.type='button';ex.style.cssText='padding:4px 10px;font-size:.8rem';ex.onclick=function(){if(!ex.dataset.c){ex.dataset.c='1';ex.textContent='Klik lagi untuk mengakhiri';return}S.qs=S.qs.slice(0,S.i+(S.picked!==null?1:0));if(!S.qs.length){stop();setup();return}finish()};top.appendChild(ex);top.appendChild(h('span',null,'Soal '+(S.i+1)+' dari '+S.qs.length+(S.aiOn||S.vis?'':' (bank latihan bawaan)')));
 var tm=h('span',null,fmt(Math.max(S.left,0)));tm.id='tm';top.appendChild(tm);app.appendChild(top);
 var bar=h('div','bar');var bi=h('i');bi.style.width=(S.i/S.qs.length*100)+'%';bar.appendChild(bi);app.appendChild(bar);
 var card=h('div','card');card.appendChild(h('p','q',q.q));if(q.svg){var sv=h('div');sv.innerHTML=q.svg;card.appendChild(sv)}
 var L='ABCDE';
 q.options.forEach(function(o,k){
  var b=h('button','opt');b.type='button';b.appendChild(h('b',null,L[k]+'.'));var sp2=h('span',null,q.osv?'':String(o));if(q.osv)sp2.innerHTML=q.osv[k];b.appendChild(sp2);
  b.onclick=function(){pick(k,card)};card.appendChild(b)});
 app.appendChild(card);
}

function pick(k,card){
 if(S.picked!==null)return;
 S.picked=k;var q=S.qs[S.i];S.ans[S.i]=k;S.times[S.i]=Math.min(300,Math.round((Date.now()-S.t0)/1000));
 var opts=card.querySelectorAll('.opt');
 [].forEach.call(opts,function(b,j){b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
 card.appendChild(h('p',null,k===q.answer?'Benar!':'Kurang tepat. Jawaban benar: '+'ABCDE'[q.answer]+'.'));
 if(q.explanation){card.appendChild(h('div','exp',q.explanation))}
 var row=h('div','ans');
 if(S.aiOn){
  var more=h('button','btn sec','Jelaskan lebih detail');
  more.onclick=function(){detail(q,k,card,more)};row.appendChild(more);
 }
 var last=S.i===S.qs.length-1;
 var nx=h('button','btn',last?'Lihat hasil':'Soal berikutnya');
 nx.onclick=function(){S.picked=null;if(last)finish();else{S.i++;quiz()}};
 row.appendChild(nx);card.appendChild(row);
}

async function detail(q,k,card,btn){
 btn.disabled=true;btn.textContent='Menjelaskan...';
 var out=h('div','exp','');card.insertBefore(out,btn.parentNode);
 try{
  out.textContent=await explainQ(q,k)||'Penjelasan tidak tersedia.';
  btn.remove();
 }catch(e){out.textContent='Penjelasan tambahan tidak tersedia saat ini.';btn.remove()}
}

function finish(){
 stop();clear();nav('latihan');
 var n=S.qs.length,ok=0;
 S.qs.forEach(function(q,i){if(S.ans[i]===q.answer)ok++});
 var pct=Math.round(ok/n*100);var prev=DB.sessions[DB.sessions.length-1];var rec=saveSession(ok);
 var c=h('div','card');
 c.appendChild(h('p','mut','Hasil latihan'));
 c.appendChild(h('p','score',ok+' / '+n));
 var verdict=pct>=85?'Sangat baik. Tinggal asah kecepatan.':pct>=60?'Baik. Pelajari lagi soal yang salah.':'Wajar untuk tahap awal. Ulangi materi dasar lalu coba lagi.';
 c.appendChild(h('p',null,pct+'%. '+verdict));
 var un=S.qs.length-S.ans.filter(function(a){return a!=null}).length;
 if(un>0)c.appendChild(h('p','mut',un+' soal belum terjawab (waktu habis atau dilewati).'));
 var again=h('button','btn','Latihan lagi');again.onclick=function(){setup()};c.appendChild(again);
 app.appendChild(c);app.appendChild(feedbackCard(rec,prev));
 var rv=h('div','card');rv.appendChild(h('label','t','Tinjau jawaban'));
 S.qs.forEach(function(q,i){
  var d=h('div','rev');
  var a=S.ans[i];
  d.appendChild(h('p','q',(i+1)+'. '+q.q));if(q.svg){var sv2=h('div');sv2.innerHTML=q.svg;d.appendChild(sv2)}
  d.appendChild(h('p',null,'Jawabanmu: '+(a==null?'kosong':'ABCDE'[a]+'. '+q.options[a])+(a===q.answer?'  (benar)':'')));
  if(a!==q.answer)d.appendChild(h('p',null,'Jawaban benar: '+'ABCDE'[q.answer]+'. '+q.options[q.answer]));
  if(q.explanation)d.appendChild(h('div','exp',q.explanation));
  rv.appendChild(d)});
 app.appendChild(rv);
}
/* ===== Tracker + feedback ===== */
var KEY='tpa_tracker_v1',DB={sessions:[],acts:[],target:20};
try{var raw=localStorage.getItem(KEY);if(raw)DB=Object.assign(DB,JSON.parse(raw))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function acc(c,t){return t?Math.round(c/t*100):0}
function todayQ(){return DB.sessions.concat(DB.acts).filter(function(x){return x.d===dkey()}).reduce(function(a,x){return a+x.n},0)}
var TIPS={Verbal:'Tambah 10 kosakata per hari dan latih analogi.',Numerik:'Hafalkan rumus persen, perbandingan, kecepatan, dan pola deret.',Logika:'Gambar diagram Venn untuk silogisme dan kuasai kontraposisi.',Figural:'Cek jumlah, posisi, rotasi, dan warna satu per satu.',Spasial:'Tandai satu sisi gambar lalu lacak saat diputar; cermin hanya membalik kiri-kanan.',SJT:'Pilih tindakan yang jujur, sesuai prosedur, komunikatif, dan menjaga hubungan kerja.'};
function nav(act){
 var el=document.getElementById('nav');el.innerHTML='';
 if(!act){el.style.display='none';return}
 el.style.display='flex';
 [['latihan','Latihan',setup],['gambar','Tes Gambar',gambar],['tracker','Tracker belajar',tracker]].forEach(function(t){
  var b=h('button','chip',t[1]);b.type='button';b.setAttribute('aria-pressed',String(act===t[0]));b.onclick=function(){t[2]()};el.appendChild(b)});
}
function saveSession(ok){
 var by={},tp={},ans=0,tm=0;
 S.qs.forEach(function(q,i){
  var a=S.ans[i];if(a==null)return;
  var c=a===q.answer?1:0,sec=S.times[i]||0;ans++;tm+=sec;
  [[by,q.bagian],[tp,q.topik]].forEach(function(p){var o=p[0][p[1]]=p[0][p[1]]||{c:0,t:0};o.c+=c;o.t++});
 });
 var rec={d:dkey(),ts:Date.now(),cat:cfg.cat,lv:cfg.level,n:S.qs.length,ans:ans,ok:ok,sec:tm,by:by,tp:tp};
 if(ans>0&&!S.saved){DB.sessions.push(rec);if(DB.sessions.length>200)DB.sessions.shift();persist();S.saved=true}
 return rec;
}
function agg(ss){var r={n:0,ans:0,ok:0,sec:0,by:{},tp:{}};
 ss.forEach(function(s){r.n+=s.n;r.ans+=s.ans;r.ok+=s.ok;r.sec+=s.sec;['by','tp'].forEach(function(k){for(var x in s[k]){var o=r[k][x]=r[k][x]||{c:0,t:0};o.c+=s[k][x].c;o.t+=s[k][x].t}})});
 return r}

/* ===== Set baru dari AI untuk Kepribadian dan Proyektif ===== */
async function genSet(kind,n){
 lastErr='';
 try{
  if(kind==='Kepribadian'){
   var T=Object.keys(DESC),k=Math.ceil(Math.max(10,n)/10),seen={},it=[],jobs=[];
   for(var j=0;j<k;j++)jobs.push(callWorker('Buat 10 pernyataan tes kepribadian model Big Five untuk seleksi kerja di Indonesia, Bahasa Indonesia, dalam konteks perilaku kerja sehari-hari. Ini kelompok ke-'+(j+1)+' dari '+k+', jadi usahakan situasi dan topiknya berbeda. Bagi rata: tepat 2 pernyataan untuk tiap sifat berikut, dengan nama sifat PERSIS seperti ini: '+T.join(', ')+'. Dari tiap 2 pernyataan, sekitar 1 berarah negatif (dir -1, menggambarkan kebalikan sifat). Pernyataan singkat dan bukan soal benar salah. Keluaran: HANYA JSON array tanpa markdown: [{"trait":"nama sifat","text":"...","dir":1}] dengan dir 1 atau -1.',50000).then(parseJsonArray).catch(function(e){lastErr=errMsg(e);return[]}));
   (await Promise.all(jobs)).forEach(function(arr){(arr||[]).forEach(function(x){var tr=normTrait(x&&x.trait),tx=String((x&&(x.text||x.pernyataan||x.statement))||'').trim(),dr=Number(x&&x.dir);if(tr&&tx&&!seen[tx]&&(dr===1||dr===-1)){seen[tx]=1;it.push([tr,tx.slice(0,140),dr])}})});
   var cnt={};it.forEach(function(x){cnt[x[0]]=(cnt[x[0]]||0)+1});
   if(it.length<10||T.some(function(q){return(cnt[q]||0)<2})){if(!lastErr)lastErr='hanya '+it.length+' butir yang terbaca dari jawaban AI';return false}
   BF=shuf(it);return true;
  }
  var a2=parseJsonArray(await callWorker('Buat '+Math.min(20,Math.max(6,n))+' kalimat tak lengkap untuk tes proyektif SSCT (Sacks Sentence Completion) dalam Bahasa Indonesia untuk seleksi kerja. Tiap kalimat berupa awalan yang belum selesai (tanpa titik), mencakup tema: diri sendiri, keluarga, atasan, rekan kerja, kegagalan, ketakutan, cita-cita, tekanan kerja, masa depan, dan kelemahan. Bukan pertanyaan dan tidak boleh ada yang sama. Keluaran: HANYA JSON array berisi string, tanpa markdown.',45000));
  var st=a2.map(function(x){return typeof x==='string'?x:String((x&&(x.text||x.kalimat||x.sentence))||'')}).filter(function(x){return x.trim().length>3}).map(function(x){return x.trim().replace(/[.\u2026]+$/,'').slice(0,120)});
  if(st.length<5){lastErr='set dari AI kurang lengkap';return false}SS=st;return true;
 }catch(e){lastErr=errMsg(e);return false}
}
